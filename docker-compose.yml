services:
  telegram-bot-agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - FREE_CLAUDE_BASE_URL=http://free-claude-code:8082
      - FREE_CLAUDE_AUTH_TOKEN=${FREE_CLAUDE_AUTH_TOKEN}
      - FREE_CLAUDE_DEFAULT_MODEL=${FREE_CLAUDE_DEFAULT_MODEL:-nvidia_nim/z-ai/glm4.7}
      - FREE_CLAUDE_TIMEOUT_SECONDS=${FREE_CLAUDE_TIMEOUT_SECONDS:-120}
      - FREE_CLAUDE_STREAMING_ENABLED=${FREE_CLAUDE_STREAMING_ENABLED:-true}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL:-}
      - TELEGRAM_GUEST_MODE_ENABLED=${TELEGRAM_GUEST_MODE_ENABLED:-true}
      - TELEGRAM_ALLOWED_CHAT_IDS=${TELEGRAM_ALLOWED_CHAT_IDS:-}
      - TELEGRAM_ADMIN_CHAT_IDS=${TELEGRAM_ADMIN_CHAT_IDS:-}
      - TELEGRAM_CHAT_ACTION_ENABLED=${TELEGRAM_CHAT_ACTION_ENABLED:-true}
      - TELEGRAM_MESSAGE_DRAFT_ENABLED=${TELEGRAM_MESSAGE_DRAFT_ENABLED:-false}
      - TELEGRAM_MEDIA_DOWNLOAD_MAX_BYTES=${TELEGRAM_MEDIA_DOWNLOAD_MAX_BYTES:-8388608}
      - TELEGRAM_BOT_NAME
      - TELEGRAM_BOT_NAME_LANGUAGE_CODE
      - TELEGRAM_BOT_SHORT_DESCRIPTION
      - TELEGRAM_BOT_SHORT_DESCRIPTION_LANGUAGE_CODE
      - TELEGRAM_BOT_DESCRIPTION
      - TELEGRAM_BOT_DESCRIPTION_LANGUAGE_CODE
      - TELEGRAM_BOT_DEFAULT_ADMINISTRATOR_RIGHTS
      - TELEGRAM_BOT_DEFAULT_ADMINISTRATOR_RIGHTS_FOR_CHANNELS
      - API_SECRET_TOKEN=${API_SECRET_TOKEN:-}
      - RATE_LIMIT_REQUESTS_PER_MINUTE=${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - free-claude-code
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  free-claude-code:
    image: ${FREE_CLAUDE_CODE_IMAGE:?Set FREE_CLAUDE_CODE_IMAGE to a pinned free-claude-code image tag or digest}
    ports:
      - "8082:8082"
    environment:
      - NIM_MODEL=nvidia_nim/z-ai/glm4.7
      # Add other required environment variables for free-claude-code
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4G
